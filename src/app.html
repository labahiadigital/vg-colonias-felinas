<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="description" content="Gatopolis — Donde cada gato cuenta. Plataforma profesional de gestión de colonias felinas urbanas." />
		<title>Gatopolis — Gestión de Colonias Felinas</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			(function() {
				const stored = localStorage.getItem('gatopolis-theme');
				if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
				if (localStorage.getItem('gatopolis-colorblind') === 'true') {
					document.documentElement.classList.add('colorblind');
				}
				if ('serviceWorker' in navigator) {
					navigator.serviceWorker.register('/sw.js');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[10000] focus:bg-primary focus:text-white focus:px-4 focus:py-2 focus:rounded-md focus:text-sm focus:font-semibold">Saltar al contenido principal</a>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
